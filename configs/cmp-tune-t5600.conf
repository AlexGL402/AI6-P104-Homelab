# Tuning profiles for cmp-tune.
#
# Copied to /etc/cmp-tune.conf at install time if that file does not exist;
# /etc/cmp-tune.conf wins when both are present, so your edits survive an
# upgrade.
#
# Every key is optional. Each section is one profile:
#
#   power_w      power limit, watts
#   core_offset  core (GPC) clock VF offset, MHz - the undervolt/overclock curve
#   mem_offset   memory clock VF offset, MHz
#   clock_min    lower bound of the locked core clock, MHz
#   clock_max    upper bound of the locked core clock, MHz
#
# Clock rules:
#   - set only clock_max and the card's own minimum supported clock is used
#     as the floor; set only clock_min and its maximum is used as the ceiling
#   - set neither and no lock is applied (any existing lock is cleared)
#   - every value is checked against what the card reports, so a profile can
#     never ask for a clock or power level outside its range
#
# Check before applying:  cmp-tune show PROFILE
# See the card's ranges:  cmp-tune status

# Card defaults: full power limit, no offsets, no clock lock.
[stock]

# Measured good on CMP 50HX: ~170 W with the curve shifted up and memory
# overclocked, held at 2100 MHz.
[efficient]
power_w = 170
core_offset = 225
mem_offset = 1000
clock_max = 2100

# Same tuning, lower ceiling for a cooler and quieter card.
[quiet]
power_w = 130
core_offset = 0
mem_offset = 0
clock_max = 1500

[max]
power_w = 225
